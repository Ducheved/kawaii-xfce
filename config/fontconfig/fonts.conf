<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Цветные эмодзи раньше чёрно-белого Symbola -->
  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family><family>Noto Color Emoji</family><family>Symbols Nerd Font</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>DejaVu Serif</family><family>Noto Color Emoji</family><family>Symbols Nerd Font</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>FiraCode Nerd Font</family><family>DejaVu Sans Mono</family><family>Noto Color Emoji</family><family>Symbols Nerd Font Mono</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>Quicksand</family><family>DejaVu Sans</family><family>Noto Color Emoji</family><family>Symbols Nerd Font</family></prefer>
  </alias>
  <!-- Symbola рисует эмодзи чёрно-белыми, отключаем его -->
  <selectfont><rejectfont><glob>/usr/share/fonts/truetype/ancient-scripts/Symbola*</glob><pattern><patelt name="family"><string>Symbola</string></patelt></pattern></rejectfont></selectfont>
</fontconfig>
